---
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      # Ignored errors from Close, os.Remove and printing
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
